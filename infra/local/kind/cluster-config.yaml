kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: perfeng-local

nodes:
  # Control plane node
  - role: control-plane
    labels:
      node-role.kubernetes.io/control-plane: ''
      workload: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP

  # Worker node for performance generators
  - role: worker
    labels:
      workload: performance-generator
      perfeng.io/node-type: generator
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=performance-generator,perfeng.io/node-type=generator"
          taints:
            - key: workload
              value: performance-generator
              effect: NoSchedule

  # Worker node for system under test
  - role: worker
    labels:
      workload: sut
      perfeng.io/node-type: sut
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=sut,perfeng.io/node-type=sut"
          taints:
            - key: workload
              value: sut
              effect: NoSchedule
