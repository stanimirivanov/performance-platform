[project]
name = "performance-platform"
version = "0.1.0"
description = "Continuous Performance Engineering Platform"
readme = "README.md"
license = { text = "Apache 2.0" }
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "boto3>=1.43.78",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.52",
    "tenacity>=9.1.4",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
perfeng-api = "uvicorn perfeng.api.main:app"
perfeng-cli = "perfeng.cli:app"


[tool.hatch.build.targets.wheel]
packages = ["src/perfeng"]

[tool.hatch.build.targets.wheel.force-include]
"src/perfeng/py.typed" = "perfeng/py.typed"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/pricepilot"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
